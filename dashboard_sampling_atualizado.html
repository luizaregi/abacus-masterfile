const qs=(s,p)=>{const i=(s.length-1)*p,l=Math.floor(i),h=Math.ceil(i);return s[l]+(s[h]-s[l])*(i-l)};

function svgBox(el,y,m){
 const W=Math.max(el.clientWidth,240),H=270,ml=62,mr=10,mt=30,mb=10,s=[...y].sort((a,b)=>a-b),n=s.length;
